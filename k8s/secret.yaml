# Dev-only placeholder values, consistent with appsettings.json across the project — not meant to
# be committed with real secrets in a production setup.
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=arcadelink_users;Username=postgres;Password=postgres"
  Jwt__Key: "dev-only-change-me-arcadelink-shared-jwt-signing-key-32bytes-min"
  RabbitMq__Password: "guest"
